<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Preeti Studio | Admin Panel</title>

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <main class="admin-page">

    <section class="login-card" id="loginCard">

      <div class="admin-logo">
        PREETI STUDIO
      </div>

      <p class="admin-label">ADMIN PANEL</p>

      <h1>Welcome Back</h1>

      <p class="login-text">
        Enter your admin password to continue.
      </p>

      <form id="loginForm">

        <div class="input-group">
          <label for="adminPassword">Admin Password</label>

          <input type="password" id="adminPassword" placeholder="Enter password" autocomplete="current-password"
            required>
        </div>

        <button type="submit" class="login-btn">
          Login
        </button>

        <p id="loginError" class="error-message"></p>

      </form>

    </section>


    <section class="dashboard" id="dashboard" hidden>

      <header class="dashboard-header">

        <div>
          <p class="admin-label">PREETI STUDIO</p>
          <h1>Admin Dashboard</h1>
        </div>

        <button id="logoutBtn" class="logout-btn">
          Logout
        </button>

      </header>


      <div class="stats">

        <div class="stat-card">
          <span>Total Bookings</span>
          <strong id="totalBookings">0</strong>
        </div>

      </div>


      <section class="bookings-section">

        <div class="section-heading">
          <div>
            <h2>Bookings</h2>
            <p class="booking-count-text">Manage your booking requests</p>
          </div>

          <button id="refreshBtn" class="refresh-btn">
            Refresh
          </button>
        </div>

        <div class="booking-tools">

          <input type="search" id="bookingSearch" class="booking-search"
            placeholder="Search by name, phone or location..." autocomplete="off">

        </div>

        <div class="booking-filters">

         <div class="date-filter-wrapper">

  <input
    type="text"
    id="bookingDateDisplay"
    class="booking-date-display"
    placeholder="DD/MM/YYYY"
    readonly
  >

  <span class="calendar-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="5" width="18" height="16" rx="2"></rect>
      <line x1="3" y1="10" x2="21" y2="10"></line>
      <line x1="8" y1="3" x2="8" y2="7"></line>
      <line x1="16" y1="3" x2="16" y2="7"></line>
    </svg>
  </span>

  <input
    type="date"
    id="bookingDateFilter"
    class="booking-date-filter"
  >

</div>

          <button type="button" id="clearFiltersBtn" class="clear-filters-btn">
            Clear
          </button>

        </div>

        <div id="bookingsContainer" class="bookings-container">
          <p class="empty-message">No bookings found.</p>
        </div>

      </section>

    </section>

  </main>

  <script src="admin.js?v=5"></script>

</body>

</html>
